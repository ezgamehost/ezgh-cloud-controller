name: CI

# Lint and tests on every pull request and push to main; nothing here has a secret or pushes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "not gofmt-ed:"; echo "$unformatted"; exit 1; }
      # service-template's pipeline vets and lints the vendored kit; here, what this repository owns
      # and the kit packages it builds on.
      - name: go vet
        run: go vet $(go list ./... | grep -v /internal/kit/)
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 $(go list ./... | grep -v /internal/kit/)
      - run: scripts/check-logging.sh

  arm64:
    # Releases ship arm64 binaries too: they must keep building.
    name: linux/arm64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/...

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -race
        # service-template's pipeline owns the vendored kit's tests.
        run: |
          mapfile -t packages < <(go list ./... | grep -v /internal/kit/)
          go test -race "${packages[@]}"
